[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchq"
version = "0.2.1"
description = "One ranked patch queue for your homelab / dev stack: Patch Today / This Week / Watching."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []  # standard library only
keywords = ["security", "vulnerability", "cve", "kev", "epss", "homelab", "patching", "osv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Environment :: Console",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/ixorex/patchq"
Issues = "https://github.com/ixorex/patchq/issues"

[project.scripts]
patchq = "patchqueue.cli:main"

[tool.setuptools.packages.find]
include = ["patchqueue*"]
