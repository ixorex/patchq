name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # uv provides every version on every runner image (setup-python has no 3.9 build for Ubuntu 26.04)
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Unit tests (stdlib only, no network)
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -t . -v
      - name: Installs cleanly
        run: |
          uv venv --python ${{ matrix.python }} .venv-check
          uv pip install --python .venv-check .
          .venv-check/bin/patchq --version
          .venv-check/bin/patchq --help >/dev/null
